[project]
name = "claims-severity"
version = "0.1.0"
description = "Claims Severity & Cost Prediction (Insurance)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "shap>=0.43.0",
    "mlflow>=2.14.0,<3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pandera>=0.18.0",
    "evidently>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["N803", "N806", "E501", "B905"]
select = ["E", "F", "W", "I", "N", "B", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
